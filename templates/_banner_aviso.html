<div
    x-data="{
        show: true,
        init() {
            const cerrado = localStorage.getItem('pago_recordatorio_cerrado');
            if (cerrado && (Date.now() - parseInt(cerrado)) < 3600000) {
                this.show = false;
            }
        }
    }"
    x-show="show"
    x-cloak
    x-transition:enter="transition ease-out duration-300"
    x-transition:enter-start="opacity-0 -translate-y-2"
    x-transition:enter-end="opacity-100 translate-y-0"
    x-transition:leave="transition ease-in duration-200"
    x-transition:leave-start="opacity-100 translate-y-0"
    x-transition:leave-end="opacity-0 -translate-y-2"
    class="sticky top-3 z-40 mx-3 mb-3 rounded-xl shadow-lg bg-gradient-to-r {{ grad_from }} {{ grad_to }} text-white text-sm px-4 py-3 flex items-center justify-between gap-3">

    <div class="flex items-center gap-3">
        <span class="text-lg">{{ icono }}</span>
        <span class="font-medium">{{ empresa.mensaje_aviso }}</span>
    </div>

    <button
        @click="show = false; localStorage.setItem('pago_recordatorio_cerrado', Date.now())"
        class="shrink-0 w-6 h-6 flex items-center justify-center rounded-full hover:bg-white/20 transition">
        ✕
    </button>
</div>
