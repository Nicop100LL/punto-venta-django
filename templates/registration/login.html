{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 via-white to-blue-100 min-h-screen flex items-center justify-center">

    <!-- Card de login -->
    <div class="relative w-full max-w-md bg-white p-10 rounded-3xl shadow-2xl overflow-hidden">

        <!-- Fondo decorativo -->
        <div class="absolute -top-16 -left-16 w-72 h-72 bg-blue-200 rounded-full opacity-30"></div>
        <div class="absolute -bottom-16 -right-16 w-72 h-72 bg-blue-300 rounded-full opacity-30"></div>

        <!-- Contenido -->
        <div class="relative z-10 text-center">
            <!-- Logo -->
            <img src="{% static 'logo.png' %}" alt="Logo"
                class="mx-auto w-28 mb-6 transition-transform duration-300 hover:scale-110">

            <!-- Mensaje de bienvenida -->
            <h2 class="text-3xl font-bold text-gray-800 mb-2">Bienvenido</h2>
            <p class="text-gray-500 mb-8">Ingrese sus credenciales para continuar</p>

            <!-- Formulario -->
            <form method="post" class="space-y-6">
                {% csrf_token %}

                <!-- Usuario -->
                <div class="relative">
                    <input type="text" name="username" id="id_username" placeholder="Usuario"
                        class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-blue-400 transition duration-300 shadow-sm">
                </div>

                <!-- Contraseña -->
                <div class="relative">
                    <input type="password" name="password" id="id_password" placeholder="Contraseña"
                        class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-blue-400 transition duration-300 shadow-sm">
                </div>

                <!-- Botón -->
                <button type="submit"
                    class="w-full py-3 bg-blue-600 text-white font-semibold rounded-xl shadow-md hover:bg-blue-700 hover:shadow-lg transition duration-300">
                    Iniciar sesión
                </button>

                <!-- Errores -->
               {% if form.errors %}
                <div class="flex items-center justify-center mt-4 bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-lg shadow-sm animate-fadeIn" role="alert">
                    <!-- Icono de advertencia -->
                    <svg class="w-5 h-5 mr-2 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01M12 2a10 10 0 100 20 10 10 0 000-20z" />
                    </svg>
                    <span class="text-sm">Usuario o contraseña incorrectos.</span>
                </div>

                 <style>
                    @keyframes fadeIn {
                        from { opacity: 0; transform: translateY(-5px); }
                        to { opacity: 1; transform: translateY(0); }
                    }
                    .animate-fadeIn {
                        animation: fadeIn 0.5s ease forwards;
                    }
                </style>
                {% endif %}
            </form>
        </div>
    </div>

</body>
</html>
