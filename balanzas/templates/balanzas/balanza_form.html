{% extends "base.html" %}
{% block content %}
<div class="max-w-xl mx-auto p-4">
  <h1 class="text-2xl font-bold mb-4">{{ titulo }}</h1>
  <form method="post" class="bg-white border rounded-lg p-6 space-y-4">
    {% csrf_token %}
    {{ form.non_field_errors }}
    {% for f in form %}
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">{{ f.label }}</label>
        {{ f }}
        {% if f.help_text %}<p class="text-xs text-gray-500 mt-1">{{ f.help_text }}</p>{% endif %}
        {% for e in f.errors %}<p class="text-xs text-red-600 mt-1">{{ e }}</p>{% endfor %}
      </div>
    {% endfor %}
    <div class="flex gap-2 pt-2">
      <button class="flex-1 px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg">Guardar</button>
      <a href="{% url 'balanzas:panel' %}" class="flex-1 px-4 py-2 bg-gray-200 hover:bg-gray-300 rounded-lg text-center">Volver</a>
    </div>
  </form>
</div>
{% endblock %}
