{% extends 'base.html' %}
{% load custom_filters %}
{% block content %}

<div class="max-w-7xl mx-auto px-2 sm:px-6 lg:px-8">
    <h1 class="text-2xl font-semibold mb-4">Editar Producto</h1>
    {% if messages %}
    {% for message in messages %}
        {% if message.tags == 'error' %}
            <div class="mb-4 px-4 py-2 rounded text-white bg-red-500">
                {{ message }}
            </div>
        {% endif %}
    {% endfor %}
{% endif %}


    <form method="POST">
        {% csrf_token %}
        <div class="space-y-4">
            <!-- Nombre -->
            <div>
                <label for="nombre" class="block text-sm font-medium">Nombre del Producto</label>
                <input type="text" id="nombre" name="nombre" value="{{ producto.nombre }}"
                    class="mt-1 block w-full rounded-md border-gray-300 shadow-sm" required>
            </div>

            <!-- Código -->
            <div>
                <label for="codigo" class="block text-sm font-medium">Código</label>

             <div class="relative flex gap-1">
                <input
                    type="text"
                    id="codigo"
                    name="codigo"
                    value="{{ producto.codigo }}"
                    class="mt-1 block w-full rounded-md border-gray-300 shadow-sm"
                    required
                >

                <!-- Generar código -->
                <button
                    type="button"
                    onclick="generarCodigoProducto()"
                    class="mt-1 px-2 border rounded text-gray-600 hover:bg-gray-100"
                    title="Generar código">
                    🔁
                </button>

                <!-- Escanear (solo móvil) -->
                <button
                    type="button"
                    onclick="abrirScannerProductoEditar()"
                    class="mt-1 px-2 border rounded text-gray-600 hover:bg-gray-100 md:hidden"
                    title="Escanear código">
                    📷
                </button>
            </div>


            </div>


            <div
                x-data="{
                    precioCompraTexto: '{{ producto.precio_compra|formato_precio }}',
                    precioVentaTexto: '{{ producto.precio_venta|formato_precio }}',
                    usarGanancia: false,
                    porcentajeGanancia: '',
                    redondear: false,

                    normalizar(valor) {
                    if (!valor) return 0
                    return Number(valor.replace(/\./g, '').replace(',', '.'))
                    },

                    formatear(valor) {
                    return valor.toLocaleString('es-AR', {
                        minimumFractionDigits: 2,
                        maximumFractionDigits: 2
                    })
                    },

                    calcularPrecio() {
                    if (!this.usarGanancia) return
                    const compra = this.normalizar(this.precioCompraTexto)
                    const porcentaje = this.normalizar(this.porcentajeGanancia)

                    if (compra <= 0 || porcentaje <= 0) return

                    const margen = porcentaje / 100
                    let precio = compra / (1 - margen)

                    if (this.redondear) {
                        precio = Math.round(precio)
                    } else {
                        precio = Math.round(precio * 100) / 100
                    }

                    this.precioVentaTexto = this.formatear(precio)
                    }
                }"
                class="space-y-3"
                >

                <!-- PRECIO COMPRA -->
                <div>
                    <label class="block text-sm font-medium">Precio de Compra</label>
                    <input
                    type="text"
                    name="precio_compra"
                    class="mt-1 block w-full rounded-md border-gray-300 shadow-sm"
                    x-model="precioCompraTexto"
                    @input="calcularPrecio()"
                    required
                    >
                </div>

                <!-- CHECKBOX GANANCIA -->
                <div class="flex items-center gap-2">
                    <input
                    type="checkbox"
                    class="rounded border-gray-300 text-blue-600 shadow-sm"
                    x-model="usarGanancia"
                    @change="calcularPrecio()"
                    >
                    <label class="text-sm font-medium text-gray-700">
                    Calcular precio con ganancia (%)
                    </label>
                </div>

                <!-- PORCENTAJE -->
                <div x-show="usarGanancia" x-transition>
                    <label class="flex items-center gap-1 text-sm font-medium"
                        x-data="{ open: false }"
                        @click.outside="open = false">

                        Margen de ganancia (%)

                        <button type="button"
                                @click="open = !open"
                                class="text-gray-400 hover:text-gray-600 focus:outline-none">
                            ❓
                        </button>

                        <div x-show="open"
                            x-cloak
                            class="absolute z-20 ml-8 mt-2 w-64 p-3 text-xs text-gray-700
                                    bg-white border rounded shadow">
                            El margen se calcula sobre el precio de venta final,
                            no sobre el costo.
                        </div>
                    </label>


                    <input
                    type="text"
                    class="mt-1 block w-full rounded-md border-gray-300 shadow-sm"
                    x-model="porcentajeGanancia"
                    @input="calcularPrecio()"
                    placeholder="Ej: 30"
                    >
                </div>

                <!-- REDONDEAR -->
                <div x-show="usarGanancia" class="flex items-center gap-2">
                    <input
                    type="checkbox"
                    class="rounded border-gray-300 text-blue-600 shadow-sm"
                    x-model="redondear"
                    @change="calcularPrecio()"
                    >
                    <label class="text-sm font-medium text-gray-700">
                    Redondear precio
                    </label>
                </div>

                <!-- PRECIO VENTA -->
                <div>
                    <label class="block text-sm font-medium">Precio de Venta</label>
                    <input
                    type="text"
                    name="precio_venta"
                    class="mt-1 block w-full rounded-md border-gray-300 shadow-sm"
                    x-model="precioVentaTexto"
                    required
                    >
                </div>

                </div>


            <!-- Aplicar descuento -->
            <div class="flex items-center gap-2">
                <input type="checkbox" id="aplica_descuento" name="aplica_descuento"
                    class="rounded border-gray-300 text-blue-600 shadow-sm"
                    {% if producto.aplica_descuento %}checked{% endif %}>
                <label for="aplica_descuento" class="text-sm font-medium text-gray-700">Aplicar descuento</label>
            </div>

            <!-- Campos condicionales -->
            <div id="campos-descuento" class="{% if not producto.aplica_descuento %}hidden{% endif %} space-y-4">

                <div>
                    <label for="cantidad_minima_descuento" class="block text-sm font-medium">
                        Cantidad mínima para descuento
                    </label>
                    <input type="number" id="cantidad_minima_descuento" name="cantidad_minima_descuento"
                        value="{{ producto.cantidad_minima_descuento }}"
                        step="1" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm">
                </div>

                <div>
                    <label for="porcentaje_descuento" class="block text-sm font-medium">
                        Porcentaje de descuento (%)
                    </label>
                    <input type="text" id="porcentaje_descuento" name="porcentaje_descuento"
                        value="{{ producto.porcentaje_descuento|default_if_none:''|formato_precio }}"
                        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm">
                </div>

            </div>

            <!-- Categoría -->
            <div>
                <label for="categoria" class="block text-sm font-medium">Categoría</label>
                <select id="categoria" name="categoria"
                    class="mt-1 block w-full rounded-md border-gray-300 shadow-sm">
                    {% for categoria in categorias %}
                        <option value="{{ categoria.id }}"
                            {% if producto.categoria.id == categoria.id %}selected{% endif %}>
                            {{ categoria.nombre }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <!-- Stock -->
            <div>
                <label for="stock_actual" class="block text-sm font-medium">Stock Actual</label>
                <input type="text" id="stock_actual" name="stock_actual"
                    value="{{ producto.stock_actual|formato_precio }}"
                    class="mt-1 block w-full rounded-md border-gray-300 shadow-sm" required>
            </div>

            <!-- Botón -->
            <button type="submit" class="mt-4 px-4 py-2 bg-blue-500 text-white rounded-md">Guardar Cambios</button>

        </div>
    </form>
</div>

<!-- Script -->
<script>
    const checkbox = document.getElementById('aplica_descuento');
    const camposDescuento = document.getElementById('campos-descuento');

    checkbox.addEventListener('change', function () {
        camposDescuento.classList.toggle('hidden', !this.checked);
    });
</script>

<script>
/*
  Abre la cámara y reemplaza el código del producto en la vista EDITAR
*/
function abrirScannerProductoEditar() {
  const modalScanner = document.getElementById('scanner-modal');
  if (!modalScanner) {
    alert('Scanner no disponible');
    return;
  }

  // mostrar modal de cámara
  modalScanner.classList.remove('hidden');

  // abrir cámara (usa ScannerCamara de base.html)
  ScannerCamara.abrir('scanner-view', (codigo) => {
    feedbackScanner();
    // cerrar cámara con un pequeño delay para asegurar detección en móviles
    setTimeout(() => {
        ScannerCamara.cerrar();
        modalScanner.classList.add('hidden');
    }, 200); // 200 ms es suficiente


    // escribir código escaneado en el input
    const input = document.getElementById('codigo');
    if (input) {
      input.value = codigo;
      input.focus();
    }
  });
}
</script>

<!--Generar código-->
<script>
function generarCodigoProducto() {
    fetch("{% url 'generar_codigo_producto' %}?producto_id={{ producto.id }}")
        .then(r => r.json())
        .then(data => {
            if (data.codigo) {
                const input = document.getElementById('codigo');
                input.value = data.codigo;
                input.focus();
            } else {
                alert('No se pudo generar el código');
            }
        })
        .catch(() => alert('Error al generar el código'));
}

</script>


{% endblock %}
