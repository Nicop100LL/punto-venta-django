{% extends 'base.html' %}
{% load custom_filters %}
{% block content %}

<div class="max-w-7xl mx-auto px-2 sm:px-6 lg:px-8">
    <h1 class="text-2xl font-semibold mb-4">Editar Producto</h1>
    {% if messages %}
    {% for message in messages %}
        {% if message.tags == 'error' %}
            <div class="mb-4 px-4 py-2 rounded text-white bg-red-500">
                {{ message }}
            </div>
        {% endif %}
    {% endfor %}
{% endif %}


    <form method="POST">
        {% csrf_token %}
        <div class="space-y-4">
            <!-- Nombre -->
            <div>
                <label for="nombre" class="block text-sm font-medium">Nombre del Producto</label>
                <input type="text" id="nombre" name="nombre" value="{{ producto.nombre }}"
                    class="mt-1 block w-full rounded-md border-gray-300 shadow-sm" required>
            </div>

            <!-- Código -->
            <div>
                <label for="codigo" class="block text-sm font-medium">Código</label>

                <div class="relative">
                    <input
                        type="text"
                        id="codigo-producto"
                        name="codigo"
                        value="{{ producto.codigo }}"
                        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm pr-10"
                        required
                    >

                    <!-- Botón cámara -->
                    <button
                        type="button"
                        onclick="abrirScannerProductoEditar()"
                        class="absolute inset-y-0 right-2 flex items-center text-gray-500 hover:text-blue-600"
                        title="Escanear código">
                        📷
                    </button>
                </div>
            </div>


            <!-- Precio venta -->
            <div>
                <label for="precio_venta" class="block text-sm font-medium">Precio de Venta</label>
                <input type="text" id="precio_venta" name="precio_venta"
                    value="{{ producto.precio_venta|formato_precio }}"
                    class="mt-1 block w-full rounded-md border-gray-300 shadow-sm" required>
            </div>

            <!-- Precio compra -->
            <div>
                <label for="precio_compra" class="block text-sm font-medium">Precio de Compra</label>
                <input type="text" id="precio_compra" name="precio_compra"
                    value="{{ producto.precio_compra|formato_precio }}"
                    class="mt-1 block w-full rounded-md border-gray-300 shadow-sm" required>
            </div>

            <!-- Aplicar descuento -->
            <div class="flex items-center gap-2">
                <input type="checkbox" id="aplica_descuento" name="aplica_descuento"
                    class="rounded border-gray-300 text-blue-600 shadow-sm"
                    {% if producto.aplica_descuento %}checked{% endif %}>
                <label for="aplica_descuento" class="text-sm font-medium text-gray-700">Aplicar descuento</label>
            </div>

            <!-- Campos condicionales -->
            <div id="campos-descuento" class="{% if not producto.aplica_descuento %}hidden{% endif %} space-y-4">

                <div>
                    <label for="cantidad_minima_descuento" class="block text-sm font-medium">
                        Cantidad mínima para descuento
                    </label>
                    <input type="number" id="cantidad_minima_descuento" name="cantidad_minima_descuento"
                        value="{{ producto.cantidad_minima_descuento }}"
                        step="1" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm">
                </div>

                <div>
                    <label for="porcentaje_descuento" class="block text-sm font-medium">
                        Porcentaje de descuento (%)
                    </label>
                    <input type="text" id="porcentaje_descuento" name="porcentaje_descuento"
                        value="{{ producto.porcentaje_descuento|default_if_none:''|formato_precio }}"
                        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm">
                </div>

            </div>

            <!-- Categoría -->
            <div>
                <label for="categoria" class="block text-sm font-medium">Categoría</label>
                <select id="categoria" name="categoria"
                    class="mt-1 block w-full rounded-md border-gray-300 shadow-sm">
                    {% for categoria in categorias %}
                        <option value="{{ categoria.id }}"
                            {% if producto.categoria.id == categoria.id %}selected{% endif %}>
                            {{ categoria.nombre }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <!-- Stock -->
            <div>
                <label for="stock_actual" class="block text-sm font-medium">Stock Actual</label>
                <input type="text" id="stock_actual" name="stock_actual"
                    value="{{ producto.stock_actual|formato_precio }}"
                    class="mt-1 block w-full rounded-md border-gray-300 shadow-sm" required>
            </div>

            <!-- Botón -->
            <button type="submit" class="mt-4 px-4 py-2 bg-blue-500 text-white rounded-md">Guardar Cambios</button>

        </div>
    </form>
</div>

<!-- Script -->
<script>
    const checkbox = document.getElementById('aplica_descuento');
    const camposDescuento = document.getElementById('campos-descuento');

    checkbox.addEventListener('change', function () {
        camposDescuento.classList.toggle('hidden', !this.checked);
    });
</script>

<script>
/*
  Abre la cámara y reemplaza el código del producto en la vista EDITAR
*/
function abrirScannerProductoEditar() {
  const modalScanner = document.getElementById('scanner-modal');
  if (!modalScanner) {
    alert('Scanner no disponible');
    return;
  }

  // mostrar modal de cámara
  modalScanner.classList.remove('hidden');

  // abrir cámara (usa ScannerCamara de base.html)
  ScannerCamara.abrir('scanner-view', (codigo) => {
    feedbackScanner();
    // cerrar cámara inmediatamente (evita duplicados)
    ScannerCamara.cerrar();
    modalScanner.classList.add('hidden');

    // escribir código escaneado en el input
    const input = document.getElementById('codigo-producto');
    if (input) {
      input.value = codigo;
      input.focus();
    }
  });
}
</script>


{% endblock %}
