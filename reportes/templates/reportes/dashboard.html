{% extends "base.html" %}

{% block content %}
<div class="p-4">

    <h1 class="text-2xl font-bold mb-4">Dashboard de Reportes</h1>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">

        <!-- CARD REPORTE DIARIO -->
        <a href="{% url 'reporte_diario' %}"
           class="block bg-white border rounded-xl p-4 shadow hover:shadow-lg transition">
            <h2 class="text-xl font-semibold mb-2">📅 Reporte Diario</h2>
            <p class="text-gray-600">Ventas, productos y totales del día.</p>
        </a>

        <!-- CARD REPORTE MENSUAL -->
        <a href="{% url 'reporte_mensual' %}"
           class="block bg-white border rounded-xl p-4 shadow hover:shadow-lg transition">
            <h2 class="text-xl font-semibold mb-2">📆 Reporte Mensual</h2>
            <p class="text-gray-600">Comparativa mes a mes y totales.</p>
        </a>

        <!-- CARD RANKING DE PRODUCTOS -->
        <a href="{% url 'ranking_productos' %}"
           class="block bg-white border rounded-xl p-4 shadow hover:shadow-lg transition">
            <h2 class="text-xl font-semibold mb-2">🏆 Productos más vendidos</h2>
            <p class="text-gray-600">Top productos por cantidad o monto.</p>
        </a>

    </div>
</div>
{% endblock %}
