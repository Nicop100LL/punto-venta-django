<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Prueba de etiquetas</title>
    <style>
        body {
            margin: 0;
            padding: 0;
        }

        .etiqueta {
            width: {{ modelo.ancho_mm }}mm;
            height: {{ modelo.alto_mm }}mm;
            background-color: {{ modelo.fondo_color }};
            border: 1px solid {{ modelo.borde_color }};
            padding: {{ modelo.padding }}px;
            margin: 5px;
            display: inline-block;
            box-sizing: border-box;
            font-family: sans-serif;
        }

        .nombre {
            font-size: {{ modelo.nombre_tamano }}px;
            font-weight: {% if modelo.nombre_negrita %}bold{% else %}normal{% endif %};
            text-align: center;
        }

        .precio {
            font-size: {{ modelo.precio_tamano }}px;
            font-weight: {% if modelo.precio_negrita %}bold{% else %}normal{% endif %};
            text-align: center;
        }

        .barcode {
            text-align: center;
            margin-top: 2px;
        }
    </style>
</head>
<body>
    {% for producto in productos %}
        <div class="etiqueta">
            {% if modelo.mostrar_nombre %}
                <div class="nombre">{{ producto.nombre }}</div>
            {% endif %}

            {% if modelo.mostrar_precio %}
                <div class="precio">${{ producto.precio }}</div>
            {% endif %}

            {% if modelo.mostrar_barcode %}
                <div class="barcode">
                    <img src="data:image/svg+xml;base64,{{ producto.barcode_svg }}" />
                </div>
            {% endif %}
        </div>
    {% endfor %}
</body>
</html>
